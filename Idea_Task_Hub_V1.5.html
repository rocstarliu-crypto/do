<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>DO · 进度管理 - 任务 · 工作日志 · 专项任务</title>
<meta name="description" content="DO · 进度管理 V1.5：任务、工作日志、专项任务融合工作台；支持自定义品牌、我的一天、计划内任务、今明四状态、完成归档与全站Excel备份。" />
<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
.app-shell{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:16px 9px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.brand{position:relative;display:flex;align-items:center;gap:10px;padding:5px 7px 13px;border-radius:12px;cursor:default}.brand:hover{background:#f8faff}.brand-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#58a8f4 0%,#596df0 58%,#7836e8 100%);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:-.5px;box-shadow:0 5px 13px rgba(83,100,224,.22);flex:none}.brand-text{min-width:0;line-height:1.05}.brand-kicker{display:block;font-weight:900;font-size:11px;letter-spacing:.4px;color:#111827;margin:0 0 2px}.brand-title-view{font-weight:900;font-size:16px;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:128px}.brand small{display:block;color:#8e97a7;margin-top:4px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:142px}.brand-edit{position:absolute;right:2px;top:2px;border:0;background:#fff;color:#8792a5;width:24px;height:24px;border-radius:7px;opacity:0;transition:.15s}.brand:hover .brand-edit{opacity:1}.brand-edit:hover{background:#edf2ff;color:var(--blue)}.brand-preview{display:flex;align-items:center;gap:12px;background:#f8faff;border:1px solid #e1e7f1;border-radius:12px;padding:12px;margin-top:10px}.brand-preview .brand-mark{width:46px;height:46px}.brand-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.brand-settings-grid .field.wide{grid-column:1/-1}
.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#637087;border-radius:9px;display:flex;align-items:center;gap:10px;height:39px;padding:0 11px;text-align:left}.nav button:hover{background:#f6f8fb}.nav button.active{background:#edf2ff;color:var(--blue2);font-weight:700}.nav .ico{width:18px;text-align:center}.nav b{margin-left:auto;background:#dfe8ff;color:var(--blue2);border-radius:9px;padding:1px 6px;font-size:10px}
.category-block{border-top:1px solid var(--line2);padding-top:12px}.category-title{display:flex;align-items:center;justify-content:space-between;padding:0 8px 5px 11px}.category-title span{font-size:11px;font-weight:700;color:#9aa3b3}.category-title button{border:0;background:transparent;color:#707b90;font-size:10px;padding:4px}.category-list{display:grid;gap:2px}.category-item{border-radius:8px;min-height:34px;display:flex;align-items:center;gap:6px;padding:0 5px 0 11px}.category-item:hover,.category-item.dragover{background:#f4f7ff}.category-item button.name{flex:1;border:0;background:transparent;text-align:left;color:#5f687b;height:32px;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-item button.name.active{color:var(--blue2);font-weight:700}.category-item .dot{width:7px;height:7px;border-radius:50%;flex:none}.category-hint{display:block;color:#a3abba;font-size:8px;padding:4px 11px}
.sidebar-card{background:#f4f7ff;border-radius:13px;padding:10px 11px;display:flex;align-items:center;gap:9px;margin-top:auto}.sidebar-card b{display:block;font-size:12px}.sidebar-card small{color:#8d96a6;font-size:8px}.count-badge{width:32px;height:32px;border-radius:10px;background:#dce6ff;color:var(--blue2);display:grid;place-items:center;font-weight:800}.backup{display:grid;grid-template-columns:1fr 1fr;gap:6px}.backup button{border:1px solid #dfe5ee;background:#fff;color:#5f6b7f;border-radius:8px;min-height:33px;font-size:9px}.backup button:hover{color:var(--blue);background:#f6f8ff;border-color:#a6b9e7}.backup small{grid-column:1/-1;text-align:center;color:#9aa3b3;font-size:8px}.sidebar-links{display:flex;gap:6px}.sidebar-links button{flex:1;border:0;background:transparent;color:#7f8aa0;font-size:9px;padding:5px}
.workspace{min-width:0;padding:22px 18px 28px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.topbar h1{font-size:24px;margin:0 0 6px}.topbar p{margin:0;color:#8090aa;font-size:11px}.top-actions{display:flex;align-items:center;gap:8px}.search{position:relative}.search input{width:315px;height:38px;border:1px solid #dfe5ee;border-radius:10px;background:#fff;padding:0 34px 0 35px;outline:none;color:#48556c}.search input:focus{border-color:#9db3ea;box-shadow:0 0 0 3px #e9efff}.search .sico{position:absolute;left:12px;top:10px;color:#9ba5b5}.search .clear{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#9ba5b5;width:24px;height:24px}.blue-button{border:0;background:var(--blue);color:#fff;height:38px;border-radius:10px;padding:0 15px;font-weight:700}.ghost-button{border:1px solid #dfe5ee;background:#fff;color:#60708a;height:38px;border-radius:10px;padding:0 12px}.ghost-button:hover{background:#f7f9fd}.visit-pill{border:1px solid #dfe5ee;background:#fff;color:#61708a;height:38px;border-radius:10px;padding:0 11px;font-size:11px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.summary article{background:#fff;border:1px solid var(--line);border-radius:13px;min-height:72px;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}.summary article:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.summary article.active{box-shadow:0 0 0 2px #bfd0ff inset}.summary .bar{width:7px;height:39px;border-radius:6px}.summary small{color:#8a94a6;display:block;font-size:10px}.summary strong{display:block;margin-top:4px;font-size:20px}.summary .today-total{margin-left:auto;color:#8a94a6;font-size:10px}
.workbench{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:calc(100vh - 190px);display:grid;grid-template-columns:minmax(420px,58%) 1fr;overflow:hidden}.list-pane{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}.pane-title{display:flex;align-items:center;justify-content:space-between;min-height:67px;padding:14px 16px;border-bottom:1px solid var(--line)}.pane-title h2{font-size:14px;margin:0 0 5px}.pane-title span{color:#8f9aab;font-size:10px}.list-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.list-actions button,.bulkbar button,.bulkbar select,.bulkbar input{border:1px solid #dfe5ee;background:#fff;color:#647188;border-radius:8px;min-height:30px;padding:4px 8px;font-size:9px}.list-actions button.danger,.bulkbar button.danger{color:var(--red);border-color:#f0cbd0}.bulkbar{padding:8px 10px;background:#f7f9fd;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bulkbar .selected-count{font-size:10px;color:#6f7e95;margin-right:2px}.task-scroll{overflow:auto;flex:1;min-height:260px}.task-stack{padding:8px 6px 15px}.group-title{color:#8490a4;font-size:9px;font-weight:700;padding:8px 10px 4px}.task-group{border-radius:9px}.task-row{min-height:52px;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;transition:.15s}.task-row:hover,.task-row.selected{background:#f1f5ff}.task-row.dragging{opacity:.45}.task-select{width:16px;height:16px}.check{width:22px;height:22px;border-radius:50%;border:1.6px solid #aab3c1;background:#fff;color:#fff;display:grid;place-items:center;flex:none}.check.done{background:#5f7dd2;border-color:#5f7dd2;font-size:11px}.task-main{min-width:0;flex:1}.task-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-main strong.strike{text-decoration:line-through;color:#9fa7b5}.task-meta{display:flex;align-items:center;gap:5px;margin-top:4px;color:#96a0b1;font-size:9px}.cat-tag{color:var(--blue);background:#edf2ff;border-radius:5px;padding:1px 5px}.status-tag{border-radius:5px;padding:1px 5px;background:#f1f3f7;color:#778297}.sub-add,.row-menu{border:0;background:transparent;color:#7a879c;font-size:9px;padding:4px;opacity:0}.task-row:hover .sub-add,.task-row:hover .row-menu{opacity:1}.subtask-list{border-left:2px solid #dce5f7;margin:0 8px 4px 36px;padding-left:5px}.task-row.sub{min-height:43px}.task-row.sub .task-main strong{font-weight:500}.empty-list{text-align:center;color:#a0a9b8;padding:60px 15px}.completed-divider{border-top:1px solid var(--line2);margin:8px 7px 0;padding:0}.completed-toggle{width:100%;border:0;background:transparent;color:#69758a;font-size:10px;font-weight:700;display:flex;align-items:center;gap:7px;padding:10px 8px;text-align:left}.completed-toggle:hover{background:#f7f9fd}.completed-toggle .chev{font-size:10px;transition:.15s}.completed-toggle .count{color:#8e98a9;font-weight:600}.completed-body.collapsed{display:none}.completed-body .task-row{opacity:.82}.quickbar{border-top:1px solid #dfe6f0;background:linear-gradient(#f8faff,#eef3ff);padding:9px 10px 8px}.quickform{background:#fff;border:1px solid #dbe3ef;border-radius:10px;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 9px}.quickform .plus{font-size:20px}.quickform input{flex:1;border:0;outline:none;background:transparent}.quickform select{border:0;color:#68748a;background:#f5f7fb;border-radius:7px;height:30px;font-size:9px}.quickbar small{display:block;color:#99a3b3;font-size:8px;margin:5px 5px 0}
.detail-pane{background:#fcfdff;min-width:0;overflow:auto}.detail-empty{height:100%;min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#929bad;padding:30px}.orbit{width:64px;height:64px;border-radius:22px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-size:25px}.detail-empty h3{font-size:14px;color:#3b4558;margin:15px 0 6px}.detail-empty p{font-size:11px;line-height:1.6;max-width:250px;margin:0}.detail-content{padding:18px}.detail-head{display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid var(--line2);padding-bottom:12px}.detail-title{border:0;background:transparent;outline:none;font-size:19px;font-weight:800;width:100%;padding:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.field{display:grid;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:9px;color:#8792a5}.field input,.field select,.field textarea{border:1px solid #dfe5ee;border-radius:8px;background:#fff;outline:none;padding:8px;color:#536075;font-size:11px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9fb5e9}.points{margin-top:14px}.points h4{font-size:11px;margin:0 0 7px;color:#5d6980}.point-row{display:grid;grid-template-columns:22px 1fr;gap:5px;margin-bottom:6px}.point-row span{height:33px;display:grid;place-items:center;color:#8994a6;font-size:10px}.point-row input{height:33px;border:1px solid #e0e5ed;border-radius:8px;padding:0 8px;outline:none;font-size:11px}.detail-actions{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line2);padding-top:12px;margin-top:15px}.detail-actions button{border:1px solid #dfe5ee;background:#fff;color:#6d798d;border-radius:8px;height:31px;padding:0 9px;font-size:9px}.detail-actions .danger{color:var(--red);border-color:#f0c8cd}
.modal-backdrop{position:fixed;inset:0;background:rgba(22,30,46,.22);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(720px,94vw);max-height:90vh;overflow:hidden;box-shadow:0 24px 60px rgba(20,32,55,.2);display:flex;flex-direction:column}.modal.small{width:min(480px,94vw)}.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0;font-size:15px}.modal-head button{border:0;background:transparent;font-size:21px;color:#8893a6}.modal-body{padding:15px;overflow:auto}.modal-foot{border-top:1px solid var(--line);padding:10px 15px;display:flex;justify-content:flex-end;gap:7px}.modal-foot button{border:1px solid #dfe5ee;background:#fff;border-radius:8px;padding:7px 13px;color:#647188}.modal-foot .primary{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-foot .danger{background:#fff5f6;color:var(--red);border-color:#f2c7ce}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:#243146;color:white;border-radius:9px;padding:9px 14px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:150}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 其余 V1.4 样式与逻辑保持 */
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand" id="brandBlock" title="双击自定义名称和标志"><span class="brand-mark" id="brandMark">DO</span><div class="brand-text"><span class="brand-kicker" id="brandKicker">DO</span><div id="brandTitleView" class="brand-title-view">进度管理</div><small id="brandSubtitle">任务 · 工作日志 · 专项任务</small></div><button class="brand-edit" id="brandEdit" title="自定义品牌">⚙</button></div>
    <nav class="nav" id="nav">
      <button data-page="today" class="active"><span class="ico">▦</span><span>我的一天</span><b id="navTodayCount">0</b></button>
      <button data-page="all"><span class="ico">☷</span><span>全部任务</span></button>
      <button data-page="calendar"><span class="ico">▣</span><span>日程</span></button>
      <button data-page="board"><span class="ico">⌘</span><span>四状态</span></button>
      <button data-page="logs"><span class="ico">▤</span><span>工作日志</span></button>
      <button data-page="special"><span class="ico">▥</span><span>专项任务</span></button>

    <section class="category-block">

</div>
