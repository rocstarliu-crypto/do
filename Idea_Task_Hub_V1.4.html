<script>
(() => {
'use strict';
const VERSION='V1.4';
const STORAGE='idea_task_hub_v1_1';
const STATES=['未开展','进行中','已完成','完成待优化'];
const STATE_COLOR={'未开展':'#8c96a8','进行中':'#4776e6','已完成':'#20a779','完成待优化':'#ee9b3c'};
const COLORS=['#4776e6','#5d79d6','#20a779','#ee9b3c','#ef6674','#805ad5','#2d9cdb','#8d98aa'];
const todayISO=()=>{const d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const nowISO=()=>new Date().toISOString();
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const deep=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtDate=(iso)=>{if(!iso)return''; const [y,m,d]=iso.split('-'); return `${y}/${m}/${d}`};
const dateCN=(iso)=>{const d=new Date(iso+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日`};
const weekdayCN=(iso)=>['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date(iso+'T00:00:00').getDay()];
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return todayFromDate(d)};
const todayFromDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const monthKey=iso=>iso.slice(0,7);
function defaultState(){
 const cats=['计划','工作','学习','长期计划','生活'].map((name,i)=>({id:uid('cat'),name,color:COLORS[i],order:i,createdAt:nowISO()}));
 return {version:VERSION,brand:'进度管理',tasks:[],categories:cats,manualLogs:{},activities:[],recycle:[],settings:{currentCategoryId:cats[0].id,boardLimit:15,boardFont:'12',lastPage:'today',completedCollapsed:false,allGroupCollapsed:{}},seq:0,visitStats:{total:0,days:{},firstVisit:nowISO(),lastVisit:nowISO()}};
}
let state=loadState();
let page=state.settings.lastPage||'today';
let selectedTaskId=null, statusFilter=null, multi=false, selectedIds=new Set(), undoStack=[], redoStack=[], calendarMode='week', calendarAnchor=todayISO(), logDate=todayISO(), searchOpen=false;
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');return x&&x.tasks&&x.categories?migrate(x):defaultState()}catch(e){return defaultState()}}
function migrate(s){s.version=VERSION;s.tasks=s.tasks||[];s.categories=s.categories||[];s.manualLogs=s.manualLogs||{};s.activities=s.activities||[];s.recycle=s.recycle||[];s.settings=Object.assign({currentCategoryId:s.categories[0]?.id||null,boardLimit:15,boardFont:'12',lastPage:'today',completedCollapsed:false,allGroupCollapsed:{}},s.settings||{});s.settings.allGroupCollapsed=s.settings.allGroupCollapsed||{};s.tasks.forEach(t=>{if(t.logHidden==null)t.logHidden=false;if(t.completionLogTitle==null)t.completionLogTitle='';if(t.repeat==null)t.repeat='';if(t.repeatEvery==null)t.repeatEvery=1;if(t.repeatUnit==null)t.repeatUnit='day';if(!t.completedAt&&['已完成','完成待优化'].includes(t.status)){const a=s.activities.find(x=>x.taskId===t.id&&x.type==='状态变更'&&x.after==='已完成');t.completedAt=a?.time||t.updatedAt||(t.dueDate?t.dueDate+'T23:59:59':'')}});s.seq=s.seq||Math.max(0,...s.tasks.map(t=>t.seq||0));s.visitStats=s.visitStats||{total:0,days:{},firstVisit:nowISO(),lastVisit:nowISO()};return s}
function save(){state.settings.lastPage=page;localStorage.setItem(STORAGE,JSON.stringify(state));updateSidebarCounts()}
function snapshot(){undoStack.push(JSON.stringify(state));if(undoStack.length>100)undoStack.shift();redoStack.length=0;updateUndoButtons()}
function undo(){if(!undoStack.length)return toast('没有可撤销的操作');redoStack.push(JSON.stringify(state));state=JSON.parse(undoStack.pop());save();render();toast('已撤销')}
function redo(){if(!redoStack.length)return toast('没有可恢复的操作');undoStack.push(JSON.stringify(state));state=JSON.parse(redoStack.pop());save();render();toast('已恢复')}
function updateUndoButtons(){document.querySelectorAll('[data-undo]').forEach(b=>b.disabled=!undoStack.length);document.querySelectorAll('[data-redo]').forEach(b=>b.disabled=!redoStack.length)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700)}
function catById(id){return state.categories.find(c=>c.id===id)}
function taskById(id){return state.tasks.find(t=>t.id===id)}
function childrenOf(id){return state.tasks.filter(t=>t.parentId===id).sort((a,b)=>a.seq-b.seq)}
function roots(){return state.tasks.filter(t=>!t.parentId).sort((a,b)=>a.seq-b.seq)}
function visibleTasks(base='all'){
 let arr=roots();
 if(base==='today') arr=arr.filter(t=>t.dueDate===todayISO());
 if(state.settings.currentCategoryId && (page==='today'||page==='all')) arr=arr.filter(t=>t.categoryId===state.settings.currentCategoryId);
 if(statusFilter) arr=arr.filter(t=>t.status===statusFilter);
 return arr.sort((a,b)=>a.seq-b.seq);
}
function counts(basePage=page){let arr=state.tasks.filter(t=>!t.parentId);if(basePage==='today')arr=arr.filter(t=>t.dueDate===todayISO());if((basePage==='today'||basePage==='all')&&state.settings.currentCategoryId)arr=arr.filter(t=>t.categoryId===state.settings.currentCategoryId);return Object.fromEntries(STATES.map(s=>[s,arr.filter(t=>t.status===s).length]))}
function logActivity(type,task,before,after,note=''){state.activities.unshift({id:uid('act'),time:nowISO(),date:todayISO(),type,taskId:task?.id||'',taskName:task?.title||'',before:before==null?'':typeof before==='string'?before:JSON.stringify(before),after:after==null?'':typeof after==='string'?after:JSON.stringify(after),note});if(state.activities.length>2000)state.activities.length=2000}
function normalizePastTasks(){const td=todayISO();let changed=false;state.tasks.forEach(t=>{if(t.dueDate && t.dueDate<td && !['已完成','完成待优化'].includes(t.status)){const old=t.dueDate;t.dueDate=td;t.updatedAt=nowISO();logActivity('自动顺延',t,old,td,'未完成任务自动顺延到当天');changed=true}});if(changed)save()}
function bumpVisit(){const d=todayISO();state.visitStats.total=(state.visitStats.total||0)+1;state.visitStats.days[d]=(state.visitStats.days[d]||0)+1;state.visitStats.lastVisit=nowISO();save()}
function addTask(title,{categoryId=state.settings.currentCategoryId||state.categories[0]?.id,dueDate=todayISO(),parentId=null,status='未开展',points=[],repeat='',repeatEvery=1,repeatUnit='day'}={}){
 title=String(title||'').trim();if(!title)return null;snapshot();const created=nowISO();const t={id:uid('task'),parentId,seq:++state.seq,title,categoryId:categoryId||state.categories[0]?.id||null,status,dueDate,points:points.length?points:['','','',''],repeat,repeatEvery,repeatUnit,createdAt:created,updatedAt:created,prevStatus:null,completedAt:status==='已完成'?created:'',completionLogTitle:'',logHidden:false};state.tasks.push(t);logActivity('新建任务',t,'',title,parentId?'新增子任务':'新增主任务');save();return t;
}
function updateTask(id,patch,reason='编辑任务'){
 const t=taskById(id);if(!t)return;snapshot();const before=deep(t),next={...patch};if(next.status==='已完成'&&t.status!=='已完成')next.completedAt=nowISO();Object.assign(t,next,{updatedAt:nowISO()});logActivity(reason,t,before,deep(t));save();render();
}
function setTaskStatus(id,status){const t=taskById(id);if(!t||!STATES.includes(status)||t.status===status)return;snapshot();const before=t.status;if(status==='已完成'){t.prevStatus=t.status;t.completedAt=nowISO();t.logHidden=false}t.status=status;t.updatedAt=nowISO();logActivity('状态变更',t,before,status);save();render()}
function advanceTaskStatus(id){const t=taskById(id);if(!t)return;const next={'未开展':'进行中','进行中':'已完成','已完成':'完成待优化'}[t.status];if(!next)return toast('“完成待优化”已是最后状态');setTaskStatus(id,next)}

function deleteTasks(ids){ids=[...new Set(ids)].filter(Boolean);if(!ids.length)return;snapshot();const all=new Set(ids);ids.forEach(id=>childrenOf(id).forEach(c=>all.add(c.id)));[...all].forEach(id=>{const t=taskById(id);if(!t)return;state.recycle.push({deletedAt:nowISO(),task:deep(t)});logActivity('删除任务',t,t.title,'已移入回收站')});state.tasks=state.tasks.filter(t=>!all.has(t.id));selectedIds.clear();if(all.has(selectedTaskId))selectedTaskId=null;save();render();toast(`已移入回收站 ${all.size} 项`)}
function restoreRecycle(idx){const item=state.recycle[idx];if(!item)return;snapshot();let t=deep(item.task);if(state.tasks.some(x=>x.id===t.id))t.id=uid('task');if(t.parentId&&!state.tasks.some(x=>x.id===t.parentId))t.parentId=null;state.tasks.push(t);state.recycle.splice(idx,1);logActivity('恢复任务',t,'回收站',t.title);save();render();openRecycle();toast('已恢复')}

function todoDateLabel(iso){if(!iso)return'稍后';const td=todayISO(),tm=addDays(td,1);if(iso===td)return'今天';if(iso===tm)return'明天';return `${+iso.slice(5,7)}月${+iso.slice(8,10)}日, ${shortWeekday(iso)}`}
function repeatLabel(t){if(!t.repeat)return'';const m={daily:'每天',workdays:'工作日',weekly:'每周',monthly:'每月',yearly:'每年'};if(t.repeat==='custom')return `每 ${t.repeatEvery||1} ${{day:'天',week:'周',month:'月',year:'年'}[t.repeatUnit||'day']}`;return m[t.repeat]||''}
function taskMetaHTML(t){const subs=childrenOf(t.id),done=subs.filter(s=>['已完成','完成待优化'].includes(s.status)).length,parts=[];if(t.dueDate===todayISO())parts.push('<span class="todo-meta-item todo-myday">☼ 我的一天</span>');parts.push(`<span class="todo-meta-item">${esc(catById(t.categoryId)?.name||'未分类')}</span>`);parts.push(`<span class="todo-meta-item">第 ${done} 步，共 ${subs.length} 步</span>`);parts.push(`<span class="todo-meta-item">▣ ${esc(todoDateLabel(t.dueDate))}</span>`);if(t.repeat)parts.push(`<span class="todo-meta-item todo-repeat" title="${esc(repeatLabel(t))}">↻ ${esc(repeatLabel(t))}</span>`);if((t.points||[]).some(x=>String(x||'').trim()))parts.push('<span class="todo-meta-item todo-note" title="有关键内容">▢</span>');return parts.join('<span>·</span>')}
function plannedGroups(active){const td=todayISO(),tm=addDays(td,1);const d2=addDays(td,2);let end=new Date(td+'T00:00:00');const day=end.getDay();const daysToSunday=(7-day)%7;end.setDate(end.getDate()+daysToSunday);let wkEnd=todayFromDate(end);if(wkEnd<d2)wkEnd=addDays(d2,4);const groups=[{key:'today',label:'今天',arr:[]},{key:'tomorrow',label:'明天',arr:[]},{key:'week',label:`${todoDateLabel(d2)} 到 ${todoDateLabel(wkEnd)}`,arr:[]},{key:'later',label:'稍后',arr:[]}];active.forEach(t=>{if(t.dueDate===td)groups[0].arr.push(t);else if(t.dueDate===tm)groups[1].arr.push(t);else if(t.dueDate&&t.dueDate>=d2&&t.dueDate<=wkEnd)groups[2].arr.push(t);else groups[3].arr.push(t)});return groups}
function plannedGroupsHTML(active){return `<div class="planned-groups">${plannedGroups(active).filter(g=>g.arr.length).map(g=>{const collapsed=!!state.settings.allGroupCollapsed[g.key];return `<section class="planned-group"><button class="planned-group-toggle" data-plan-group="${g.key}"><span>${collapsed?'›':'⌄'}</span><span class="planned-date-range">${esc(g.label)}</span><span class="planned-count">${g.arr.length}</span></button><div class="planned-group-body ${collapsed?'collapsed':''}" data-plan-group-body="${g.key}">${g.arr.sort((a,b)=>a.seq-b.seq).map(taskGroupHTML).join('')}</div></section>`}).join('')}</div>`}

="addPoint">＋ 增加关键点</button>${!t.parentId?'<button id="addSubDetail">＋ 子任务</button>':'<button id="promoteTask">提升为主任务</button>'}<button data-defer="1">明天</button><button data-defer="7">下周</button><button id="nextMonth">下个月</button><button id="customDate">自定义</button><button class="danger" id="deleteTask">删除</button></div>${!t.parentId?`<div class="subtasks-box"><div class="section-head"><h3>子任务 ${childrenOf(t.id).length}</h3><button id="addSub2">＋ 添加</button></div><div class="mini-list">${childrenOf(t.id).map(s=>`<div class="mini-row"><button class="check ${s.status==='已完成'?'done':''}" data-complete="${s.id}">${s.status==='已完成'?'✓':''}</button><span style="flex:1" data-open-task="${s.id}" data-editable="task" data-id="${s.id}">${esc(s.title)}</span><small class="mini-date">${esc(todoDateLabel(s.dueDate))}${s.repeat?' · ↻ '+esc(repeatLabel(s)):''}</small><button class="mini-delete" data-delete-sub="${s.id}">删除</button></div>`).join('')||'<small style="color:#9aa3b3">暂无子任务</small>'}</div></div>`:''}<div class="audit-box"><div class="section-head"><h3>最近修改记录</h3></div>${acts.map(a=>`<div class="audit-row">${esc(a.type)} · ${new Date(a.time).toLocaleString()}<small>${esc(a.note||formatChange(a.before,a.after))}</small></div>`).join('')||'<small style="color:#9aa3b3">暂无记录</small>'}</div></div>`}

function bindTaskPage(){

function bulkStatus(status){if(!selectedIds.size)return toast('请先选择任务');snapshot();[...selectedIds].forEach(id=>{const t=taskById(id);if(t){const old=t.status;if(status==='已完成'&&t.status!=='已完成'){t.completedAt=nowISO();t.logHidden=false}t.status=status;t.updatedAt=nowISO();logActivity('批量状态变更',t,old,status)}});save();render();toast(`已批量改为${status}`)}

function calendarHTML(){const title=calendarMode==='week'?weekRangeText(calendarAnchor):calendarMode==='month'?monthRangeText(calendarAnchor):`${dateCN(calendarAnchor)} ${weekdayCN(calendarAnchor)}`;return `<section class="page-card"><div class="calendar-head"><div><h2>${title}</h2><p>按日、周或月查看已安排的任务和子任务</p></div><div class="calendar-controls"><div class="mode-switch">${['day','week','month'].map(m=>`<button data-cal-mode="${m}" class="${calendarMode===m?'active':''}">${{day:'日',week:'周',month:'月'}[m]}</button>`).join('')}</div><button id="calPrev">‹</button><button id="calToday">今天</button><button id="calNext">›</button></div></div>${calendarBodyHTML()}</section>`}
function weekStart(iso){const d=new Date(iso+'T00:00:00'),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return todayFromDate(d)}
function weekRangeText(iso){const s=weekStart(iso),e=addDays(s,6);return `${dateCN(s)} - ${dateCN(e)}`}
function monthRangeText(iso){const d=new Date(iso+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月`}
function tasksOn(date){return state.tasks.filter(t=>t.dueDate===date).sort((a,b)=>a.seq-b.seq)}
function calendarBodyHTML(){if(calendarMode==='week'){const s=weekStart(calendarAnchor);return `<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=addDays(s,i),ts=tasksOn(d);return `<div class="week-day ${d===todayISO()?'today':''}"><div class="day-h"><span>${['周一','周二','周三','周四','周五','周六','周日'][i]}</span><b>${+d.slice(8)}</b><button data-add-on-date="${d}">＋</button></div>${ts.map(t=>`<button class="week-task" data-open-cal-task="${t.id}" style="border-left-color:${STATE_COLOR[t.status]}"><strong>${esc(t.title)}${t.repeat?' ↻':''}</strong><small>${esc(t.status)} · ${esc(catById(t.categoryId)?.name||'')}${t.repeat?' · '+esc(repeatLabel(t)):''}</small></button>`).join('')||'<div style="text-align:center;color:#b0b8c5;font-size:8px;margin-top:20px">点 + 安排任务</div>'}</div>`}).join('')}</div>`}
 if(calendarMode==='day'){const ts=tasksOn(calendarAnchor);return `<div class="day-view"><div class="day-summary"><strong>${+calendarAnchor.slice(8)}</strong><span>${weekdayCN(calendarAnchor)}<br>${calendarAnchor.slice(0,7)}</span><button class="blue-button" data-add-on-date="${calendarAnchor}" style="margin-top:20px">＋ 安排任务</button></div><div class="day-tasks">${ts.map(t=>`<div class="day-task"><button class="check ${t.status==='已完成'?'done':''}" data-complete="${t.id}">${t.status==='已完成'?'✓':''}</button><strong data-open-cal-task="${t.id}">${esc(t.title)}${t.repeat?' ↻':''}</strong><small>${esc(t.status)} · ${esc(catById(t.categoryId)?.name||'')}${t.repeat?' · '+esc(repeatLabel(t)):''}</small></div>`).join('')||'<div class="empty-list">当天暂无任务</div>'}</div></div>`}
 const d=new Date(calendarAnchor+'T00:00:00'),first=new Date(d.getFullYear(),d.getMonth(),1),start=new Date(first),wd=(start.getDay()+6)%7;start.setDate(start.getDate()-wd);return `<div class="month-grid">${['周一','周二','周三','周四','周五','周六','周日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);const iso=todayFromDate(x),outside=x.getMonth()!==d.getMonth(),ts=tasksOn(iso);return `<div class="month-cell ${outside?'outside':''} ${iso===todayISO()?'today':''}"><div class="date-no">${x.getDate()}</div>${ts.slice(0,4).map(t=>`<button class="month-task" data-open-cal-task="${t.id}" style="border-left-color:${STATE_COLOR[t.status]}">${esc(t.title)}${t.repeat?' ↻':''}</button>`).join('')}${ts.length>4?`<small>+${ts.length-4} 项</small>`:''}<button data-add-on-date="${iso}" style="border:0;background:transparent;color:#9aa4b5;font-size:9px">＋</button></div>`}).join('')}</div>`}

function taskCompletionDate(t){if(t.completedAt)return t.completedAt.slice(0,10);const a=state.activities.find(x=>x.taskId===t.id&&x.type==='状态变更'&&x.after==='已完成');if(a)return a.date;return ['已完成','完成待优化'].includes(t.status)?((t.updatedAt||'').slice(0,10)||t.dueDate||''):''}

const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}

function colName(i){let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}
function sheetXML(rows){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>{if(v==null)v='';if(typeof v==='number'&&Number.isFinite(v))return `<c r="${colName(c)}${r+1}"><v>${v}</v></c>`;return `<c r="${colName(c)}${r+1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`}
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}

worksheet+xml"/>`).join('')}</Types>`});files.push({name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`});files.push({name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n],i)=>`<sheet name="${xmlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`});files.push({name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`});sheets.forEach(([,rows],i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(rows)}));const blob=zipStore(files),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Idea_Task_Hub_${VERSION}_${todayISO()}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(getSpecialWorkspaceSnapshot()?'Excel 已导出（含专项任务工作簿）':'Excel 已导出；专项任务在同域发布后可自动并入总备份')}
function findEOCD(u8){for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--)if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===0x05&&u8[i+3]===0x06)return i;return -1}
const rd16=(u,i)=>u[i]|u[i+1]<<8,rd32=(u,i)=>(u[i]|u[i+1]<<8|u[i+2]<<16|u[i+3]<<24)>>>0;
async function unzip(buf){const u=new Uint8Array(buf),e=findEOCD(u);if(e<0)throw Error('不是有效的 XLSX/ZIP 文件');const count=rd16(u,e+10),off=rd32(u,e+16),dec=new TextDecoder(),out={};let p=off;for(let k=0;k<count;k++){if(rd32(u,p)!==0x02014b50)throw Error('ZIP 中央目录损坏');const method=rd16(u,p+10),cs=rd32(u,p+20),nl=rd16(u,p+28),el=rd16(u,p+30),cl=rd16(u,p+32),lo=rd32(u,p+42),name=dec.decode(u.slice(p+46,p+46+nl));const lnl=rd16(u,lo+26),lel=rd16(u,lo+28),start=lo+30+lnl+lel,raw=u.slice(start,start+cs);let data;if(method===0)data=raw;else if(method===8){const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}else throw Error('不支持的 XLSX 压缩方式 '+method);out[name]=data;p+=46+nl+el+cl}return out}
function parseXML(u8){return new DOMParser().parseFromString(new TextDecoder().decode(u8),'application/xml')}
function cellValue(c,shared){const t=c.getAttribute('t');if(t==='inlineStr')return c.querySelector('is t')?.textContent||'';const v=c.querySelector('v')?.textContent||'';if(t==='s')return shared[+v]||'';if(t==='b')return v==='1';return v}
function colIndex(ref){let n=0;for(const ch of ref.match(/^[A-Z]+/)?.[0]||'A')n=n*26+ch.charCodeAt(0)-64;return n-1}
async function readXLSX(file){const files=await unzip(await file.arrayBuffer()),wb=parseXML(files['xl/workbook.xml']),rels=parseXML(files['xl/_rels/workbook.xml.rels']);const relMap={};rels.querySelectorAll('Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));let shared=[];if(files['xl/sharedStrings.xml']){const sx=parseXML(files['xl/sharedStrings.xml']);shared=[...sx.querySelectorAll('si')].map(si=>[...si.querySelectorAll('t')].map(t=>t.textContent).join(''))}const result={};for(const sh of wb.querySelectorAll('sheet')){const name=sh.getAttribute('name'),rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let target=relMap[rid];if(!target)continue;target=target.replace(/^\//,'');if(!target.startsWith('xl/'))target='xl/'+target.replace(/^\.\//,'');const sx=parseXML(files[target]);const rows=[];sx.querySelectorAll('sheetData row').forEach(r=>{const arr=[];r.querySelectorAll('c').forEach(c=>arr[colIndex(c.getAttribute('r')||'A1')]=cellValue(c,shared));rows.push(arr)});result[name]=rows}return result}
function excelDateISO(v){const n=+v;if(Number.isFinite(n)&&n>20000&&n<100000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return d.toISOString().slice(0,10)}return String(v||'')}
function rowsToObjects(rows){if(!rows?.length)return[];const heads=rows[0].map(x=>String(x||'').trim());return rows.slice(1).filter(r=>r.some(x=>String(x||'').trim()!=='')).map(r=>Object.fromEntries(heads.map((h,i)=>[h,r[i]??''])))}
async function importXLSX(file){try{const book=await readXLSX(file);const taskSheet=book['任务']||Object.values(book)[0],objs=rowsToObjects(taskSheet);if(!objs.length)throw Error('Excel 中没有任务数据');snapshot();let cats=book['分类']?rowsToObjects(book['分类']):[];if(cats.length){state.categories=cats.map((o,i)=>({id:o['分类ID']||uid('cat'),order:+o['排序']||i,name:o['分类名称']||`分类${i+1}`,color:o['颜色']||COLORS[i%COLORS.length],createdAt:o['创建时间']||nowISO()}))}const catMap=new Map(state.categories.map(c=>[c.name,c.id]));const ensureCat=name=>{name=String(name||'计划').trim()||'计划';if(catMap.has(name))return catMap.get(name);const c={id:uid('cat'),order:state.categories.length,name,color:COLORS[state.categories.length%COLORS.length],createdAt:nowISO()};state.categories.push(c);catMap.set(name,c.id);return c.id};let imported=[];for(const [i,o] of objs.entries()){const title=o['任务名称']||o['标题']||o['任务']||'';if(!String(title).trim())continue;const id=o['任务ID']||uid('task'),parentId=o['父任务ID']||'',seq=+(o['添加顺序']||o['序号']||i+1),status=STATES.includes(o['状态'])?o['状态']:(o['状态']==='未开始'?'未开展':'未开展'),pts=[o['关键内容1']||'',o['关键内容2']||'',o['关键内容3']||'',o['关键内容4']||''];imported.push({id,parentId:parentId||null,seq,title:String(title),categoryId:ensureCat(o['分类']),status,dueDate:excelDateISO(o['日期'])||todayISO(),repeat:o['重复']||'',repeatEvery:+o['重复间隔']||1,repeatUnit:o['重复单位']||'day',points:pts,createdAt:o['创建时间']||nowISO(),updatedAt:o['更新时间']||nowISO(),prevStatus:null,completedAt:o['完成时间']||'',completionLogTitle:o['完成日志名称']||'',logHidden:String(o['日志隐藏']||'').trim()==='是'})}const ids=new Set(imported.map(t=>t.id));imported.forEach(t=>{if(t.parentId&&!ids.has(t.parentId)&&!state.tasks.some(x=>x.id===t.parentId))t.parentId=null});state.tasks=imported;state.seq=Math.max(0,...imported.map(t=>t.seq));state.activities=[];if(book['活动记录'])state.activities=rowsToObjects(book['活动记录']).map(o=>({id:uid('act'),time:o['时间']||nowISO(),date:o['日期']||todayISO(),type:o['类型']||'导入记录',taskId:o['任务ID']||'',taskName:o['任
