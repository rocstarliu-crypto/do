<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Idea Task Hub V1.4｜进度管理</title>
  <meta name="description" content="Idea Task Hub V1.4 公共版。首次打开为空白任务数据。">
</head>
<body>
<script>
(async function(){
  try {
    const response = await fetch('./Idea_Task_Hub_V1.4.html?v=1.4', {cache:'no-store'});
    if (!response.ok) throw new Error('V1.4 主文件读取失败：' + response.status);
    let html = await response.text();
    // 公共发布版使用独立本地存储空间：新访客为空白，同时避免读取同域其他旧版页面的数据。
    html = html.replace("const STORAGE='idea_task_hub_v1_1';", "const STORAGE='idea_task_hub_v1_4_do_public';");
    html = html.replace('Idea Task Hub V1.4：我的一天、计划内任务、今明四状态、完成日志、专项任务、头脑风暴与全站Excel备份。', 'Idea Task Hub V1.4 公共版：首次打开为空白任务数据；支持我的一天、计划内任务、今明四状态、完成日志、专项任务、头脑风暴与全站Excel备份。');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<main style="font-family:Microsoft YaHei,Arial;padding:40px;max-width:760px;margin:auto"><h2>Idea Task Hub V1.4</h2><p>网页加载失败，请刷新后重试。</p><pre style="white-space:pre-wrap;color:#a33">'+String(error)+'</pre></main>';
  }
})();
</script>
</body>
</html>
