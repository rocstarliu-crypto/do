name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site with isolated blank special-task module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/ppm /tmp/ppm.tar.gz
          mkdir -p _site /tmp/ppm

          # Copy Idea Task Hub source to the Pages artifact.
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

          # Bundle the existing project-progress-manager into /special so the
          # Special Tasks module keeps all original functionality but has its
          # own blank, isolated browser storage.
          curl -L --fail --retry 3 \
            https://github.com/rocstarliu-crypto/project-progress-manager/archive/refs/heads/main.tar.gz \
            -o /tmp/ppm.tar.gz
          tar -xzf /tmp/ppm.tar.gz -C /tmp/ppm --strip-components=1
          cp -R /tmp/ppm _site/special

          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Public hub: point Special Tasks to the bundled isolated copy.
          # 2) Keep total Excel backup reading the same isolated workspace key.
          for name in ('index.html', 'Idea_Task_Hub_V1.4.html'):
              p = Path('_site') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'src="https://rocstarliu-crypto.github.io/project-progress-manager/"',
                  'src="./special/"'
              )
              s = s.replace(
                  "const SPECIAL_WORKSPACE_KEY='project-progress-manager-v1.4.1-workspace';",
                  "const SPECIAL_WORKSPACE_KEY='idea-task-hub-special-v1.4.1-workspace';"
              )
              s = re.sub(
                  r"const SPECIAL_PREV_KEYS=\[[^\n]*\];",
                  "const SPECIAL_PREV_KEYS=[];",
                  s,
                  count=1
              )
              p.write_text(s, encoding='utf-8')

          # Special Tasks gets a completely independent storage namespace.
          app = Path('_site/special/js/app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace(
              "const WORKSPACE_STORAGE_KEY = 'project-progress-manager-v1.4.1-workspace';",
              "const WORKSPACE_STORAGE_KEY = 'idea-task-hub-special-v1.4.1-workspace';"
          )
          s = re.sub(
              r"const PREVIOUS_WORKSPACE_STORAGE_KEYS = \[[^\n]*\];",
              "const PREVIOUS_WORKSPACE_STORAGE_KEYS = [];",
              s,
              count=1
          )
          s = re.sub(
              r"const LEGACY_STORAGE_KEY = '[^']*';",
              "const LEGACY_STORAGE_KEY = 'idea-task-hub-special-legacy-unused';",
              s,
              count=1
          )

          # Replace only the default workspace. All task/edit/Excel/cloud code
          # remains the original project-progress-manager implementation.
          pattern = r"function createDefaultWorkspace\(\) \{.*?\n\}\n\nfunction mergedWorkspaceColumns"
          replacement = """function createDefaultWorkspace() {
  const columns=defaultColumns();
  return {kind:WORKSPACE_KIND,version:2,appVersion:APP_VERSION,nextProjectId:2,activeProjectId:'project_1',columns:columns,projects:[
    {id:'project_1',name:'项目一',state:createEmptyState(columns)}
  ]};
}

function mergedWorkspaceColumns"""
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Failed to patch createDefaultWorkspace')
          app.write_text(s, encoding='utf-8')

          # Verification: deployment must not contain demo tasks in the
          # Special Tasks default workspace and must use the isolated key.
          check = app.read_text(encoding='utf-8')
          assert "idea-task-hub-special-v1.4.1-workspace" in check
          block = check.split('function createDefaultWorkspace()',1)[1].split('function mergedWorkspaceColumns',1)[0]
          assert 'createDemoCategoryState' not in block
          assert "state:createEmptyState(columns)" in block
          print('Special Tasks blank/default isolation verification: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
